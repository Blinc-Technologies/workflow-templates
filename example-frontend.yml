
name: Build

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Highest environment to ship to (lower ones are included). Blank = test.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - test
          - staging
          - prod

jobs:
  build:
    # id-token: write is required for build.yml's ECR/OIDC steps -- a reusable workflow's
    # job can never request more than the caller grants, so this must be declared here.
    permissions:
      id-token: write
      contents: read
    uses: Blinc-Technologies/workflow-templates/.github/workflows/build.yml@main
    with:
      environment: ${{ inputs.environment }}
      project_name: ${{ vars.PROJECT_NAME }}
      components_to_build: 'web'
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

# Frontends bake ENV_VARS (from each GitHub environment) into the image, so a prod build makes
# three images -- test, staging and prod -- each with its own environment's vars. The release
# auto-deploys only prod (as a PR); run Release with environment=test/staging to ship the others
# without rebuilding. A frontend image can't be retagged for a tier it wasn't built for.

# ─── Release Workflow (.github/workflows/release.yml) ──────
# Same as the backend example (example.yml) — no changes needed.
