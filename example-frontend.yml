
name: Build

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create release artifacts'
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    uses: Blinc-Technologies/workflow-templates/.github/workflows/build.yml@main
    with:
      project_name: ${{ vars.PROJECT_NAME }}
      components_to_build: 'web'
      create_release: ${{ inputs.create_release || 'false' }}
      frontend_env: ${{ vars.FRONTEND_ENV_FILE }}
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}

