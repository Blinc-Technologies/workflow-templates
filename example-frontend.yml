
name: Build

on:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Leave blank to build + tag for every environment (main only). Pick one to build just that tag.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - test
          - staging
          - prod
      create_release:
        description: 'Create release artifacts'
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  build:
    # id-token: write is required for build.yml's ECR/OIDC steps -- a reusable workflow's
    # job can never request more than the caller grants, so this must be declared here.
    permissions:
      id-token: write
      contents: read
    uses: Blinc-Technologies/workflow-templates/.github/workflows/build.yml@main
    with:
      environment: ${{ inputs.environment }}
      project_name: ${{ vars.PROJECT_NAME }}
      components_to_build: 'web'
      create_release: ${{ inputs.create_release || 'false' }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

