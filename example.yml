# File: .github/workflows/release.yml
# This goes in ANY repository that wants to use the reusable release workflow
# Example: blinc-payment-service, blinc-notification-service, etc.
#
# How shipping works:
#   * Merge to main            -> Build (test)   -> Release deploys test.
#   * Run Build, env=staging   -> images for test + staging -> Release deploys staging only.
#   * Run Build, env=prod      -> images for test + staging + prod -> Release opens the prod
#                                 GitOps PR only. No git tag needed.
#   * Run Release, env=<any>   -> ship an image that's already built to that tier, e.g. the test or
#     (run_id optional)           staging image from a prod build, or retag a staging build to prod
#                                 in ECR. No rebuild.

name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: 'test | staging | prod'
        default: 'prod'
        type: choice
        options:
          - test
          - staging
          - prod
      components:
        required: false
        description: 'Comma-separated list of components to deploy (empty = all)'
        default: ''
      run_id:
        required: false
        description: 'Build run ID (empty = latest successful Build of the selected branch head)'
        default: ''
  # Optional: pushing a v* tag still releases that commit to prod, but it is no longer required.
  # push:
  #   tags: ['v*']

jobs:
  release:
    # id-token: write lets the release assume aws_role_arn to retag images in ECR when promoting
    # (e.g. staging -> prod). A reusable workflow can never get more than the caller grants.
    permissions:
      id-token: write
      contents: read
    uses: Blinc-Technologies/workflow-templates/.github/workflows/release.yml@main
    with:
      # A tag push only ever means prod -- forcing it here (rather than leaving it to
      # release.yml's internal logic) also makes GitHub's prod Environment protection
      # rules (e.g. required reviewers) actually engage before the job runs.
      environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}
      components: ${{ inputs.components }}
      run_id: ${{ inputs.run_id }}
      trigger_type: ${{ github.event_name == 'push' && 'push_tag' || github.event_name }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
      workflow_run_conclusion: ${{ github.event.workflow_run.conclusion }}
      workflow_run_branch: ${{ github.event.workflow_run.head_branch }}
      project_name: ${{ vars.PROJECT_NAME }}
    secrets:
      gh_actions_token: ${{ secrets.GH_ACTIONS_TOKEN }}
      gh_gitops_token: ${{ secrets.GH_GITOPS_TOKEN }}
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN }}

