# File: .github/workflows/release.yml
# This goes in ANY repository that wants to use the reusable release workflow
# Example: blinc-payment-service, blinc-notification-service, etc.

name: Release

on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: 'test | staging | prod'
        default: 'test'
        type: choice
        options:
          - test
          - staging
          - prod
      components:
        required: true
        description: 'Comma-separated list of components to deploy'
        default: 'api, worker, scheduler'
      run_id:
        required: true
        description: 'Run ID of the build workflow'

jobs:
  release:
    uses: Blinc-Technologies/workflow-templates/.github/workflows/release.yml@main
    with:
      # A tag push only ever means prod -- forcing it here (rather than leaving it to
      # release.yml's internal logic) also makes GitHub's prod Environment protection
      # rules (e.g. required reviewers) actually engage before the job runs.
      environment: ${{ github.event_name == 'push' && 'prod' || inputs.environment }}
      components: ${{ inputs.components }}
      run_id: ${{ inputs.run_id }}
      trigger_type: ${{ github.event_name == 'push' && 'push_tag' || github.event_name }}
      workflow_run_id: ${{ github.event.workflow_run.id }}
      workflow_run_conclusion: ${{ github.event.workflow_run.conclusion }}
      workflow_run_branch: ${{ github.event.workflow_run.head_branch }}
      project_name: ${{ vars.PROJECT_NAME }}
    secrets:
      gh_actions_token: ${{ secrets.GH_ACTIONS_TOKEN }}
      gh_gitops_token: ${{ secrets.GH_GITOPS_TOKEN }}

