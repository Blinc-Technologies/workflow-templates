name: Reusable Release Workflow

# Deploys a Build run's images through GitOps.
#
#   * Auto (workflow_run): deploys ONLY the tier the build targeted. A prod build opens the prod
#     GitOps PR, a staging build deploys staging, a test build deploys test -- no tag or manual run.
#     The images for the lower tiers were built as well, ready to be released without a rebuild.
#   * Manual (workflow_dispatch): deploys one environment. run_id is optional (defaults to the
#     latest successful Build of the commit you run it from). Use it to ship an already-built image
#     to another tier, e.g. a prod build's test/staging images. If the build has no image for the
#     requested tier but does have one in ECR (e.g. staging -> prod), the existing image is retagged
#     in ECR -- no rebuild.
#   * Tag push (push_tag): still supported as a shortcut for "manual prod", but no longer required.

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod (manual / tag runs only)'
      components:
        required: false
        type: string
        description: 'Comma-separated list. Empty = every component in the build.'
      run_id:
        required: false
        type: string
        description: 'Run ID of the build workflow. Empty = latest successful Build of this commit.'
      project_name:
        required: true
        type: string
        description: 'Project name'
      gitops_repo:
        required: false
        type: string
        default: 'Blinc-Technologies/blinc-gitops'
        description: 'GitOps repository'
      trigger_type:
        required: true
        type: string
        description: 'workflow_run | workflow_dispatch | push_tag'
      workflow_run_id:
        required: false
        type: string
        description: 'Workflow run ID for auto-triggered runs'
      workflow_run_conclusion:
        required: false
        type: string
        description: 'Conclusion of workflow run'
      workflow_run_branch:
        required: false
        type: string
        description: 'Branch of workflow run'
      runner_label:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "Runner label to use (default: ubuntu-latest for GitHub-hosted)"
    secrets:
      gh_actions_token:
        required: true
      gh_gitops_token:
        required: true
      aws_role_arn:
        required: false
        description: >
          IAM role (OIDC) allowed to read/put images in ECR. Only needed to promote an existing
          image to a tier it wasn't built for (e.g. staging -> prod). The caller must then grant
          `id-token: write`.

env:
  GITOPS_REPO: ${{ inputs.gitops_repo }}
  GITOPS_REPO_PATH: blinc-gitops

jobs:
  # Decides the target environment(s) before the release job starts, so each release job can run
  # under the matching GitHub environment (its vars, e.g. NAMESPACE, and protection rules).
  resolve:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    outputs:
      environments: ${{ steps.target.outputs.environments }}
      run_id: ${{ steps.params.outputs.run_id }}
    if: >
      inputs.trigger_type == 'workflow_dispatch' ||
      inputs.trigger_type == 'push_tag' ||
      (
        inputs.trigger_type == 'workflow_run' &&
        inputs.workflow_run_conclusion == 'success' &&
        inputs.workflow_run_branch == 'main'
      )

    steps:
      - name: Determine run parameters
        id: params
        env:
          GH_TOKEN: ${{ secrets.gh_actions_token }}
        run: |
          RUN_ID=""
          ENVIRONMENT=""
          case "${{ inputs.trigger_type }}" in
            workflow_run)
              # environment(s) are picked from the build's metadata in the next steps
              RUN_ID="${{ inputs.workflow_run_id }}"
              ;;
            push_tag)
              ENVIRONMENT="prod"
              ;;
            *)
              ENVIRONMENT="${{ inputs.environment }}"
              RUN_ID="${{ inputs.run_id }}"
              if [[ "$ENVIRONMENT" != "test" && "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "prod" ]]; then
                echo "❌ Invalid environment: $ENVIRONMENT"
                echo "   Valid environments are: test, staging, prod"
                exit 1
              fi
              ;;
          esac

          if [[ -z "$RUN_ID" ]]; then
            # No run_id (tag push, or a manual run that left it blank): use the most recent successful
            # Build of this exact commit that published release artifacts.
            # Assumes the consuming repo's build workflow file is build.yml.
            for CANDIDATE in $(gh api "repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=20" \
                                 --jq '.workflow_runs[].id'); do
              COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE/artifacts?name=release-artifacts" \
                        --jq '[.artifacts[] | select(.expired | not)] | length')
              if [[ "$COUNT" -gt 0 ]]; then RUN_ID="$CANDIDATE"; break; fi
            done

            if [[ -z "$RUN_ID" ]]; then
              echo "❌ No successful Build run with release artifacts found for commit ${{ github.sha }}."
              echo "   Run Build on main (pick an environment to build for), or pass run_id explicitly."
              exit 1
            fi
            echo "✅ Resolved Build run $RUN_ID for commit ${{ github.sha }}"
          fi

          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

      # workflow_run fires for every successful Build on main, including ones that published nothing
      # (a verification-only build, or no matching components). Skip those quietly; a manual or tag
      # release pointing at such a run is a mistake, so fail it loudly instead.
      - name: Check for release artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.gh_actions_token }}
        run: |
          RUN_ID="${{ steps.params.outputs.run_id }}"
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts?name=release-artifacts" \
            --jq '[.artifacts[] | select(.expired | not)] | length')

          if [[ "$COUNT" -gt 0 ]]; then
            echo "✅ Build run $RUN_ID has release artifacts."
            echo "found=true" >> $GITHUB_OUTPUT
          elif [[ "${{ inputs.trigger_type }}" == "workflow_run" ]]; then
            echo "::notice::Build run $RUN_ID published no release artifacts (verification build, or nothing to build) -- skipping release."
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "❌ Build run $RUN_ID has no release artifacts (or they have expired)."
            echo "   Run Build on main with the environment you want, then release that run."
            exit 1
          fi

      - name: Download Artifacts
        if: inputs.trigger_type == 'workflow_run' && steps.artifacts.outputs.found == 'true'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.gh_actions_token }}
          run-id: ${{ steps.params.outputs.run_id }}
          name: release-artifacts
          path: releases/

      - name: Resolve target environments
        id: target
        run: |
          if [[ "${{ steps.artifacts.outputs.found }}" != "true" ]]; then
            echo "environments=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [[ "${{ inputs.trigger_type }}" != "workflow_run" ]]; then
            echo "environments=[\"${{ steps.params.outputs.environment }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi

          if ! ls releases/*.json >/dev/null 2>&1; then
            echo "❌ No release metadata found in the downloaded artifact."
            exit 1
          fi

          if jq -se 'any(.[]; has("environments"))' releases/*.json >/dev/null; then
            # Current build.yml: deploy only the tier the build targeted (prod = GitOps PR). The lower
            # tiers' images were built too, but stay on the shelf until someone releases them.
            ENVS=$(jq -sc '[.[].environment // empty] | unique' releases/*.json)
          else
            # Metadata from an older build.yml: keep the old behaviour of a single auto-deploy to
            # test or staging, inferred from the build's target / the registries it pushed to.
            BUILD_ENV=$(jq -sr '[.[].environment // empty] | first // empty' releases/*.json)
            ENV=""
            case "$BUILD_ENV" in
              test|staging) ENV="$BUILD_ENV" ;;
              prod)         ;;
              *)
                for CANDIDATE in test staging; do
                  if jq -se --arg env "$CANDIDATE" \
                    'any(.[]; (.base_tag == null and $env == "test") or ((.registries[$env] // "") != ""))' \
                    releases/*.json >/dev/null; then
                    ENV="$CANDIDATE"
                    break
                  fi
                done
                ;;
            esac
            ENVS=$(jq -nc --arg e "$ENV" 'if $e == "" then [] else [$e] end')
          fi

          # Deploy in tier order: test, staging, then prod.
          ENVS=$(jq -nc --argjson e "$ENVS" '["test","staging","prod"] | map(select(. as $t | $e | index($t)))')
          echo "✅ Auto-release targets: $ENVS"
          echo "environments=$ENVS" >> $GITHUB_OUTPUT

  release:
    needs: resolve
    if: needs.resolve.outputs.environments != '' && needs.resolve.outputs.environments != '[]'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      # One environment at a time (test -> staging -> prod), which also avoids racing GitOps pushes.
      max-parallel: 1
      matrix:
        environment: ${{ fromJson(needs.resolve.outputs.environments || '[]') }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.gh_actions_token }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          name: release-artifacts
          path: releases/

      - name: Verify release metadata and determine components
        id: components
        run: |
          if ! ls releases/*.json >/dev/null 2>&1; then
            echo "❌ No release metadata found in the downloaded artifact."
            echo "   Run Build on main with the environment you want, then release that run."
            exit 1
          fi
          echo "✅ Release metadata found."

          if [[ "${{ inputs.trigger_type }}" == "workflow_run" || -z "${{ inputs.components }}" ]]; then
            COMPONENTS=$(ls releases/*.json | xargs -n1 basename | sed 's/\.json//g' | paste -sd, -)
            echo "📦 Auto-detected components: $COMPONENTS"
          else
            COMPONENTS="${{ inputs.components }}"
            echo "📦 Using provided components: $COMPONENTS"
          fi

          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          COMPONENTS_ARRAY="[$(echo "$COMPONENTS" | sed 's/,/, /g')]"
          echo "components_array=$COMPONENTS_ARRAY" >> $GITHUB_OUTPUT

      - name: Set environment variables
        id: env
        run: |
          ENVIRONMENT="${{ matrix.environment }}"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

          ENVIRONMENT_UPPER=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          echo "environment_upper=$ENVIRONMENT_UPPER" >> $GITHUB_OUTPUT

      # Prod's real gate is the GitOps PR (plus any reviewers on the prod GitHub environment);
      # a git tag is no longer required.
      - name: Enforce prod deploy policy (main only)
        if: matrix.environment == 'prod'
        run: |
          IFS=',' read -ra COMPONENTS <<< "${{ steps.components.outputs.components }}"
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT=$(echo "$COMPONENT" | xargs)
            FILE="releases/$COMPONENT.json"
            if [[ ! -f "$FILE" ]]; then
              echo "❌ Missing release metadata for $COMPONENT"
              exit 1
            fi

            BRANCH=$(jq -r .branch "$FILE")
            if [[ "$BRANCH" != "main" ]]; then
              echo "❌ Deployment to prod is only allowed from main. Found: $BRANCH"
              exit 1
            fi
          done
          echo "✅ All components were built from main."

      # Build once, tag many: if this build has no image for the target tier but already pushed the
      # same image to ECR under another tier (staging and prod share one repo), retag it instead of
      # rebuilding. Frontends can't be promoted -- their env vars are baked in per tier.
      - name: Plan image promotions
        id: promote-plan
        env:
          HAS_AWS_ROLE: ${{ secrets.aws_role_arn != '' }}
        run: |
          ENV="${{ matrix.environment }}"
          PLAN=""
          REGION=""

          IFS=',' read -ra COMPONENTS <<< "${{ steps.components.outputs.components }}"
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT=$(echo "$COMPONENT" | xargs)
            FILE="releases/$COMPONENT.json"
            if [[ ! -f "$FILE" ]]; then
              echo "❌ Release metadata for $COMPONENT not found"
              exit 1
            fi

            BASE_TAG=$(jq -r '.base_tag // empty' "$FILE")
            # Legacy metadata (pre multi-env tagging) is handled by the manifest step.
            [[ -z "$BASE_TAG" ]] && continue
            # Already built for this tier -- nothing to promote.
            [[ -n "$(jq -r --arg env "$ENV" '.registries[$env] // empty' "$FILE")" ]] && continue

            TYPE=$(jq -r '.type // "service"' "$FILE")
            if [[ "$ENV" == "test" ]]; then
              echo "❌ $COMPONENT has no test image in this build, and ECR images aren't copied back to the test registry. Run Build with environment=test (or higher)."
              exit 1
            fi
            if [[ "$TYPE" == "web" ]]; then
              echo "❌ $COMPONENT is a frontend: its env vars are baked in at build time, so another tier's image can't be reused for $ENV."
              echo "   Run Build on main with environment=$ENV (that also redeploys the tiers below it)."
              exit 1
            fi

            SRC_ENV=""
            for CANDIDATE in staging prod; do
              if [[ "$CANDIDATE" != "$ENV" && -n "$(jq -r --arg env "$CANDIDATE" '.registries[$env] // empty' "$FILE")" ]]; then
                SRC_ENV="$CANDIDATE"
                break
              fi
            done
            if [[ -z "$SRC_ENV" ]]; then
              echo "❌ Build run ${{ needs.resolve.outputs.run_id }} only produced a test image for $COMPONENT (amd64, test registry) -- there is nothing in ECR to retag."
              echo "   Run Build on main with environment=$ENV; it will deploy test, staging and $ENV in one go."
              exit 1
            fi

            REPO=$(jq -r --arg env "$SRC_ENV" '.registries[$env]' "$FILE")
            # <account>.dkr.ecr.<region>.amazonaws.com/<repo>
            REGION=$(echo "${REPO%%/*}" | cut -d. -f4)
            echo "🔁 $COMPONENT: will retag $SRC_ENV-$BASE_TAG -> $ENV-$BASE_TAG"
            PLAN+="$COMPONENT $REPO $SRC_ENV-$BASE_TAG $ENV-$BASE_TAG"$'\n'
          done

          if [[ -n "$PLAN" && "$HAS_AWS_ROLE" != "true" ]]; then
            echo "❌ Promotion needed but no aws_role_arn secret was passed to the release workflow."
            echo "   Pass aws_role_arn and grant 'id-token: write' in the calling workflow, or rebuild with environment=$ENV."
            exit 1
          fi

          echo "needed=$([[ -n "$PLAN" ]] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "region=$REGION" >> $GITHUB_OUTPUT
          echo "plan<<EOF" >> $GITHUB_OUTPUT
          echo -n "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: steps.promote-plan.outputs.needed == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ steps.promote-plan.outputs.region }}

      - name: Promote images (retag in ECR, no rebuild)
        if: steps.promote-plan.outputs.needed == 'true'
        env:
          PLAN: ${{ steps.promote-plan.outputs.plan }}
        run: |
          ENV="${{ matrix.environment }}"
          while read -r COMPONENT REPO SRC DST; do
            [[ -z "$COMPONENT" ]] && continue
            REPO_NAME="${REPO#*/}"

            RESP=$(aws ecr batch-get-image --repository-name "$REPO_NAME" --image-ids imageTag="$SRC" \
              --accepted-media-types \
                application/vnd.oci.image.index.v1+json \
                application/vnd.docker.distribution.manifest.list.v2+json \
                application/vnd.oci.image.manifest.v1+json \
                application/vnd.docker.distribution.manifest.v2+json \
              --output json)
            MANIFEST=$(jq -r '.images[0].imageManifest // empty' <<< "$RESP")
            MEDIA_TYPE=$(jq -r '.images[0].imageManifestMediaType // empty' <<< "$RESP")
            if [[ -z "$MANIFEST" ]]; then
              echo "❌ $REPO_NAME:$SRC not found in ECR ($(jq -c '.failures' <<< "$RESP")). It may have been removed by a lifecycle policy -- rebuild with environment=$ENV."
              exit 1
            fi

            if OUT=$(aws ecr put-image --repository-name "$REPO_NAME" --image-tag "$DST" \
                       --image-manifest "$MANIFEST" --image-manifest-media-type "$MEDIA_TYPE" 2>&1); then
              echo "✅ $REPO_NAME: $SRC -> $DST"
            elif grep -q ImageAlreadyExistsException <<< "$OUT"; then
              echo "ℹ️ $REPO_NAME:$DST already points at this image"
            else
              echo "$OUT"
              exit 1
            fi

            # Record the promoted image so the manifest step below picks it up.
            FILE="releases/$COMPONENT.json"
            jq --arg env "$ENV" --arg repo "$REPO" '.registries[$env] = $repo' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          done <<< "$PLAN"

      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.gh_gitops_token }}
          path: ${{ env.GITOPS_REPO_PATH }}
          persist-credentials: false

      - name: Install yq for YAML manipulation
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate or Update GitOps manifests
        run: |
          write_new_values() {
            local VALUES_FILE="$1" REPOSITORY="$2" TAG="$3" COMPONENT="$4"
            local COMMIT_SHA="$5" BRANCH="$6" ENV_NAME="$7" INSTANCE_NAME="${8:-}" TYPE="${9:-service}"
            {
              echo "image:"
              echo "  repository: $REPOSITORY"
              echo "  tag: $TAG"
              echo "projectName: ${{ inputs.project_name }}"
              echo "componentName: $COMPONENT"
              echo "instanceName: $INSTANCE_NAME"
              echo "namespace: ${{ vars.NAMESPACE }}"
              echo "releaseId: $COMMIT_SHA"
              echo "branch: $BRANCH"
              echo "commit: $COMMIT_SHA"
              echo "env:"
              echo "  ENVIRONMENT: $ENV_NAME"
              if [[ "$TYPE" != "web" ]]; then
                echo "externalSecret:"
                echo "  enabled: true"
                echo "  forceUpdateAnnotation: ${COMMIT_SHA}-v1"
              fi
              echo "replicaCount: 1"
              echo "podLabels: {}"
              echo "addDaprSidecar: false"
              echo "podAnnotations: {}"
              echo "livenessProbe:"
              echo "  enabled: true"
              echo "readinessProbe:"
              echo "  enabled: true"
              echo "volumeMounts: []"
              echo "volumes: []"
              echo "service:"
              echo "  enabled: true"
              echo "  type: ClusterIP"
              echo "isGrpc: false"
              echo "autoscaling:"
              echo "  enabled: false"
            } > "$VALUES_FILE"
          }

          update_values() {
            local VALUES_FILE="$1" REPOSITORY="$2" TAG="$3"
            local COMMIT_SHA="$4" BRANCH="$5" ENV_NAME="$6" COMPONENT="$7" TYPE="${8:-service}"
            yq eval ".image.repository = \"$REPOSITORY\""           -i "$VALUES_FILE"
            yq eval ".image.tag = \"$TAG\""                         -i "$VALUES_FILE"
            yq eval ".releaseId = \"$COMMIT_SHA\""                  -i "$VALUES_FILE"
            yq eval ".branch = \"$BRANCH\""                         -i "$VALUES_FILE"
            yq eval ".commit = \"$COMMIT_SHA\""                     -i "$VALUES_FILE"
            yq eval ".env.ENVIRONMENT = \"$ENV_NAME\""              -i "$VALUES_FILE"
            if [[ "$TYPE" != "web" ]]; then
              yq eval ".externalSecret.forceUpdateAnnotation = \"${COMMIT_SHA}-v1\"" -i "$VALUES_FILE"
            fi
          }

          deploy_instance() {
            local COMPONENT="$1" TAG="$2" REPOSITORY="$3" BRANCH="$4"
            local COMMIT_SHA="$5" ENV_NAME="$6" INSTANCE_FOLDER="$7" TYPE="${8:-service}"

            local BASE
            if [[ "$TYPE" == "web" ]]; then
              BASE="${{ env.GITOPS_REPO_PATH }}/web/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}/$INSTANCE_FOLDER"
            else
              BASE="${{ env.GITOPS_REPO_PATH }}/microservices/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}/$INSTANCE_FOLDER"
            fi

            local VALUES_FILE="$BASE/values.yml"
            mkdir -p "$BASE"

            if [[ -f "$VALUES_FILE" ]]; then
              echo "📝 Updating existing values.yml for $INSTANCE_FOLDER"
              update_values "$VALUES_FILE" "$REPOSITORY" "$TAG" "$COMMIT_SHA" "$BRANCH" "$ENV_NAME" "$COMPONENT" "$TYPE"
            else
              echo "✨ Creating new values.yml for $INSTANCE_FOLDER"
              write_new_values "$VALUES_FILE" "$REPOSITORY" "$TAG" "$COMPONENT" "$COMMIT_SHA" "$BRANCH" "$ENV_NAME" "$INSTANCE_FOLDER" "$TYPE"
            fi
          }

          # ── main loop ─────────────────────────────────────────────────────
          IFS=',' read -ra COMPONENTS <<< "${{ steps.components.outputs.components }}"
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT=$(echo "$COMPONENT" | xargs)
            echo "🔍 Processing component: $COMPONENT"

            METADATA_FILE="releases/$COMPONENT.json"
            if [[ ! -f "$METADATA_FILE" ]]; then
              echo "❌ Release metadata for $COMPONENT not found"
              exit 1
            fi

            # build.yml pushes one image with an alias tag per tier (test-/staging-/prod-), sharing one
            # ECR repo for staging+prod. Pick the alias for the environment we're actually deploying
            # to -- the promotion step above has already filled registries.<env> if it retagged.
            BASE_TAG=$(jq -r '.base_tag // empty' "$METADATA_FILE")
            if [[ -n "$BASE_TAG" ]]; then
              REPOSITORY=$(jq -r --arg env "${{ steps.env.outputs.environment }}" '.registries[$env] // empty' "$METADATA_FILE")
              if [[ -z "$REPOSITORY" ]]; then
                echo "❌ No ${{ steps.env.outputs.environment }} image available for $COMPONENT -- this build was never pushed to that registry."
                exit 1
              fi
              TAG="${{ steps.env.outputs.environment }}-$BASE_TAG"
            else
              # Backward compatibility: metadata from a build.yml older than the ECR/multi-env tagging change.
              TAG=$(jq -r .tag "$METADATA_FILE")
              REPOSITORY=$(jq -r .repository "$METADATA_FILE")
            fi
            BRANCH=$(jq -r .branch     "$METADATA_FILE")
            COMMIT_SHA=$(jq -r .commit "$METADATA_FILE")

            # Backward compatibility: metadata artifacts produced by a build.yml older
            # than this change won't have a "type" field. Fall back to the legacy
            # component=="web" convention in that case.
            TYPE=$(jq -r '.type // empty' "$METADATA_FILE")
            if [[ -z "$TYPE" || "$TYPE" == "null" ]]; then
              if [[ "$COMPONENT" == "web" ]]; then TYPE="web"; else TYPE="service"; fi
            fi

            case "${{ steps.env.outputs.environment }}" in
              "prod")    ENV_NAME="Production" ;;
              "staging") ENV_NAME="Staging" ;;
              *)         ENV_NAME="Test" ;;
            esac

            # ── Discover instances from GitOps repo ────────────────────────
            # Convention: an instance folder belongs to a component if its name
            # either equals the component exactly  (e.g. issuer)
            # or ends with  -<component>            (e.g. fcmb-issuer, kuda-issuer)
            #
            # This keeps the structure flat at microservices/test/<project>/<folder>
            # so every folder is picked up by the AppSet glob: microservices/test/*/*
            #
            # To add a new instance: create the folder + values.yml in the GitOps repo.
            # To remove an instance: delete the folder from the GitOps repo.
            # ──────────────────────────────────────────────────────────────
            if [[ "$TYPE" == "web" ]]; then
              PROJECT_BASE="${{ env.GITOPS_REPO_PATH }}/web/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}"
            else
              PROJECT_BASE="${{ env.GITOPS_REPO_PATH }}/microservices/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}"
            fi

            # Match folders named exactly <component> or ending with -<component>
            INSTANCE_DIRS=$(find "$PROJECT_BASE" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
              | grep -E "(^|/)${COMPONENT}$|(^|/)[^/]+-${COMPONENT}$" \
              | sort)

            if [[ -z "$INSTANCE_DIRS" ]]; then
              echo "✅ No existing instances found for $COMPONENT — deploying as base instance"
              deploy_instance "$COMPONENT" "$TAG" "$REPOSITORY" "$BRANCH" "$COMMIT_SHA" "$ENV_NAME" "$COMPONENT" "$TYPE"
            else
              echo "📂 Instances found for $COMPONENT: $(echo "$INSTANCE_DIRS" | xargs -n1 basename | paste -sd', ' -)"
              while IFS= read -r INSTANCE_PATH; do
                INSTANCE_FOLDER=$(basename "$INSTANCE_PATH")
                echo "✅ Deploying $INSTANCE_FOLDER (component=$COMPONENT) tag=$TAG"
                deploy_instance "$COMPONENT" "$TAG" "$REPOSITORY" "$BRANCH" "$COMMIT_SHA" "$ENV_NAME" "$INSTANCE_FOLDER" "$TYPE"
              done <<< "$INSTANCE_DIRS"
            fi
          done

      - name: Extract commit hash
        id: metadata
        run: |
          FIRST_COMPONENT=$(echo "${{ steps.components.outputs.components }}" | cut -d',' -f1 | xargs)
          COMMIT_SHA=$(jq -r .commit "releases/$FIRST_COMPONENT.json")
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Push to GitOps repo (test/staging)
        if: matrix.environment != 'prod'
        run: |
          cd ${{ env.GITOPS_REPO_PATH }}
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin "https://x-access-token:${{ secrets.gh_gitops_token }}@github.com/${{ env.GITOPS_REPO }}.git"
          git add .

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git commit -m "🚀 Deploy ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.env.outputs.environment_upper }}"

          # Other projects push to the same GitOps repo; rebase and retry if we lost the race.
          for ATTEMPT in 1 2 3; do
            if git push origin main; then
              echo "✅ Changes pushed to GitOps repository"
              exit 0
            fi
            echo "⚠️ Push rejected (attempt $ATTEMPT) -- rebasing onto latest main"
            git pull --rebase origin main
          done
          echo "❌ Could not push to the GitOps repository after 3 attempts"
          exit 1

      - name: Open PR for production deployment
        if: matrix.environment == 'prod'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.gh_gitops_token }}
          base: main
          branch: release-${{ inputs.project_name }}-${{ steps.metadata.outputs.short_sha }}-${{ steps.env.outputs.environment }}
          title: "[${{ steps.env.outputs.environment_upper }}] Release ${{ inputs.project_name }}"
          path: ${{ env.GITOPS_REPO_PATH }}
          body: |
            ## Release Details

            **Project:** ${{ inputs.project_name }}
            **Environment:** ${{ steps.env.outputs.environment_upper }}
            **Commit:** ${{ steps.metadata.outputs.commit_sha }}
            **Components:** ${{ steps.components.outputs.components_array }}

            This PR was automatically generated by the release workflow.
          commit-message: "🚀 Release ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.env.outputs.environment_upper }}"
          delete-branch: true
          labels: release-${{ inputs.project_name }}

      - name: Surface PR link in job summary
        if: matrix.environment == 'prod' && steps.create-pr.outputs.pull-request-url
        run: |
          echo "### 🚀 Production release PR" >> $GITHUB_STEP_SUMMARY
          echo "[${{ steps.create-pr.outputs.pull-request-url }}](${{ steps.create-pr.outputs.pull-request-url }})" >> $GITHUB_STEP_SUMMARY
