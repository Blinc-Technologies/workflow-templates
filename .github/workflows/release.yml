name: Reusable Release Workflow

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod (optional for auto-triggered runs)'
      components:
        required: false
        type: string
        description: 'Comma-separated list (optional for auto-triggered runs)'
      run_id:
        required: false
        type: string
        description: 'Run ID of the build workflow (optional for auto-triggered runs)'
      project_name:
        required: true
        type: string
        description: 'Project name'
      gitops_repo:
        required: false
        type: string
        default: 'Blinc-Technologies/blinc-gitops'
        description: 'GitOps repository'
      trigger_type:
        required: true
        type: string
        description: 'workflow_run | workflow_dispatch | push_tag'
      workflow_run_id:
        required: false
        type: string
        description: 'Workflow run ID for auto-triggered runs'
      workflow_run_conclusion:
        required: false
        type: string
        description: 'Conclusion of workflow run'
      workflow_run_branch:
        required: false
        type: string
        description: 'Branch of workflow run'
      runner_label:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "Runner label to use (default: ubuntu-latest for GitHub-hosted)"
    secrets:
      gh_actions_token:
        required: true
      gh_gitops_token:
        required: true

env:
  GITOPS_REPO: ${{ inputs.gitops_repo }}
  GITOPS_REPO_PATH: blinc-gitops

jobs:
  release:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    # push_tag always means prod -- the caller must pass environment: 'prod' explicitly
    # (not derivable from inputs.environment alone at job-start time), so that GitHub's
    # prod Environment protection rules (e.g. required reviewers) actually engage here.
    environment: ${{ inputs.environment || 'test' }}
    if: >
      inputs.trigger_type == 'workflow_dispatch' ||
      inputs.trigger_type == 'push_tag' ||
      (
        inputs.trigger_type == 'workflow_run' &&
        inputs.workflow_run_conclusion == 'success' &&
        inputs.workflow_run_branch == 'main'
      )

    steps:
      - name: Determine run parameters
        id: params
        run: |
          if [[ "${{ inputs.trigger_type }}" == "workflow_run" ]]; then
            echo "environment=test" >> $GITHUB_OUTPUT
            echo "run_id=${{ inputs.workflow_run_id }}" >> $GITHUB_OUTPUT

          elif [[ "${{ inputs.trigger_type }}" == "push_tag" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT

            # A tag push only carries a commit SHA, not a build run_id -- resolve it by
            # asking the API for the most recent successful Build run against that exact
            # commit. Assumes the consuming repo's build workflow file is build.yml.
            RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.gh_actions_token }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/runs?head_sha=${{ github.sha }}&status=success&per_page=1" \
              | jq -r '.workflow_runs[0].id // empty')

            if [[ -z "$RUN_ID" ]]; then
              echo "❌ No successful Build run found for commit ${{ github.sha }}."
              echo "   This commit must already have gone through the normal main-branch Build pipeline before it can be tagged for a prod release."
              exit 1
            fi

            echo "✅ Resolved Build run $RUN_ID for tagged commit ${{ github.sha }}"
            echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "run_id=${{ inputs.run_id }}" >> $GITHUB_OUTPUT

            ENVIRONMENT="${{ inputs.environment }}"
            if [[ "$ENVIRONMENT" != "test" && "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "prod" ]]; then
              echo "❌ Invalid environment: $ENVIRONMENT"
              echo "   Valid environments are: test, staging, prod"
              exit 1
            fi
          fi

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.gh_actions_token }}
          run-id: ${{ steps.params.outputs.run_id }}
          name: release-artifacts
          path: releases/

      - name: Verify release metadata and determine components
        id: components
        run: |
          if ! ls releases/*.json >/dev/null 2>&1; then
            echo "❌ No release metadata found in the downloaded artifact."
            echo "   This likely means the triggering build workflow ran with 'should_deploy=false'."
            echo "   Please trigger the build again with 'should_deploy=true' or run this release workflow manually pointing to a build run ID that generated artifacts."
            exit 1
          fi
          echo "✅ Release metadata found."

          if [[ "${{ inputs.trigger_type }}" == "workflow_run" || ! -n "${{ inputs.components }}" ]]; then
            COMPONENTS=$(ls releases/*.json | xargs -n1 basename | sed 's/\.json//g' | paste -sd, -)
            echo "📦 Auto-detected components: $COMPONENTS"
          else
            COMPONENTS="${{ inputs.components }}"
            echo "📦 Using provided components: $COMPONENTS"
          fi

          echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
          COMPONENTS_ARRAY="[$(echo "$COMPONENTS" | sed 's/,/, /g')]"
          echo "components_array=$COMPONENTS_ARRAY" >> $GITHUB_OUTPUT

      - name: Set environment variables
        id: env
        run: |
          ENVIRONMENT="${{ steps.params.outputs.environment }}"
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

          ENVIRONMENT_UPPER=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
          echo "environment_upper=$ENVIRONMENT_UPPER" >> $GITHUB_OUTPUT

      - name: Enforce prod deploy policy (main only and must be tagged)
        if: steps.params.outputs.environment == 'prod'
        run: |
          IFS=',' read -ra COMPONENTS <<< "${{ steps.components.outputs.components }}"
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT=$(echo "$COMPONENT" | xargs)
            FILE="releases/$COMPONENT.json"
            if [[ ! -f "$FILE" ]]; then
              echo "❌ Missing release metadata for $COMPONENT"
              exit 1
            fi

            BRANCH=$(jq -r .branch "$FILE")
            COMMIT_HASH=$(jq -r .commit "$FILE")

            if [[ "$BRANCH" != "main" ]]; then
              echo "❌ Deployment to prod is only allowed from main. Found: $BRANCH"
              exit 1
            fi

            # git/matching-refs (not git/refs) -- the latter returns a bare object instead
            # of a 1-element array when exactly one tag matches, breaking this jq pipeline.
            TAG_EXISTS=$(curl -s -H "Authorization: Bearer ${{ secrets.gh_actions_token }}" \
              "https://api.github.com/repos/${{ github.repository }}/git/matching-refs/tags" \
              | jq --arg sha "$COMMIT_HASH" '[.[] | select(.object.sha == $sha)] | length')

            if [[ "$TAG_EXISTS" -eq 0 ]]; then
              echo "❌ Commit $COMMIT_HASH is not tagged. Production deployments require a Git tag."
              exit 1
            else
              echo "✅ Commit $COMMIT_HASH is tagged. OK to deploy."
            fi
          done

      - name: Checkout GitOps repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.gh_gitops_token }}
          path: ${{ env.GITOPS_REPO_PATH }}
          # peter-evans/create-pull-request sets its own Authorization header when pushing;
          # a persisted one here collides with it (duplicate header -> 400 from GitHub).
          # The test/staging push step sets its own auth explicitly instead of relying on this.
          persist-credentials: false

      - name: Install yq for YAML manipulation
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate or Update GitOps manifests
        run: |
          write_new_values() {
            local VALUES_FILE="$1" REPOSITORY="$2" TAG="$3" COMPONENT="$4"
            local COMMIT_SHA="$5" BRANCH="$6" ENV_NAME="$7" INSTANCE_NAME="${8:-}" TYPE="${9:-service}"
            {
              echo "image:"
              echo "  repository: $REPOSITORY"
              echo "  tag: $TAG"
              echo "projectName: ${{ inputs.project_name }}"
              echo "componentName: $COMPONENT"
              echo "instanceName: $INSTANCE_NAME"
              echo "namespace: ${{ vars.NAMESPACE }}"
              echo "releaseId: $COMMIT_SHA"
              echo "branch: $BRANCH"
              echo "commit: $COMMIT_SHA"
              echo "env:"
              echo "  ENVIRONMENT: $ENV_NAME"
              if [[ "$TYPE" != "web" ]]; then
                echo "externalSecret:"
                echo "  enabled: true"
                echo "  forceUpdateAnnotation: ${COMMIT_SHA}-v1"
              fi
              echo "replicaCount: 1"
              echo "podLabels: {}"
              echo "addDaprSidecar: false"
              echo "podAnnotations: {}"
              echo "livenessProbe:"
              echo "  enabled: true"
              echo "readinessProbe:"
              echo "  enabled: true"
              echo "volumeMounts: []"
              echo "volumes: []"
              echo "service:"
              echo "  enabled: true"
              echo "  type: ClusterIP"
              echo "isGrpc: false"
              echo "autoscaling:"
              echo "  enabled: false"
            } > "$VALUES_FILE"
          }

          update_values() {
            local VALUES_FILE="$1" REPOSITORY="$2" TAG="$3"
            local COMMIT_SHA="$4" BRANCH="$5" ENV_NAME="$6" COMPONENT="$7" TYPE="${8:-service}"
            yq eval ".image.repository = \"$REPOSITORY\""           -i "$VALUES_FILE"
            yq eval ".image.tag = \"$TAG\""                         -i "$VALUES_FILE"
            yq eval ".releaseId = \"$COMMIT_SHA\""                  -i "$VALUES_FILE"
            yq eval ".branch = \"$BRANCH\""                         -i "$VALUES_FILE"
            yq eval ".commit = \"$COMMIT_SHA\""                     -i "$VALUES_FILE"
            yq eval ".env.ENVIRONMENT = \"$ENV_NAME\""              -i "$VALUES_FILE"
            if [[ "$TYPE" != "web" ]]; then
              yq eval ".externalSecret.forceUpdateAnnotation = \"${COMMIT_SHA}-v1\"" -i "$VALUES_FILE"
            fi
          }

          deploy_instance() {
            local COMPONENT="$1" TAG="$2" REPOSITORY="$3" BRANCH="$4"
            local COMMIT_SHA="$5" ENV_NAME="$6" INSTANCE_FOLDER="$7" TYPE="${8:-service}"

            local BASE
            if [[ "$TYPE" == "web" ]]; then
              BASE="${{ env.GITOPS_REPO_PATH }}/web/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}/$INSTANCE_FOLDER"
            else
              BASE="${{ env.GITOPS_REPO_PATH }}/microservices/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}/$INSTANCE_FOLDER"
            fi

            local VALUES_FILE="$BASE/values.yml"
            mkdir -p "$BASE"

            if [[ -f "$VALUES_FILE" ]]; then
              echo "📝 Updating existing values.yml for $INSTANCE_FOLDER"
              update_values "$VALUES_FILE" "$REPOSITORY" "$TAG" "$COMMIT_SHA" "$BRANCH" "$ENV_NAME" "$COMPONENT" "$TYPE"
            else
              echo "✨ Creating new values.yml for $INSTANCE_FOLDER"
              write_new_values "$VALUES_FILE" "$REPOSITORY" "$TAG" "$COMPONENT" "$COMMIT_SHA" "$BRANCH" "$ENV_NAME" "$INSTANCE_FOLDER" "$TYPE"
            fi
          }

          # ── main loop ─────────────────────────────────────────────────────
          IFS=',' read -ra COMPONENTS <<< "${{ steps.components.outputs.components }}"
          for COMPONENT in "${COMPONENTS[@]}"; do
            COMPONENT=$(echo "$COMPONENT" | xargs)
            echo "🔍 Processing component: $COMPONENT"

            METADATA_FILE="releases/$COMPONENT.json"
            if [[ ! -f "$METADATA_FILE" ]]; then
              echo "❌ Release metadata for $COMPONENT not found"
              exit 1
            fi

            # build.yml pushes one image with an alias tag per environment (test-/staging-/prod-),
            # sharing one ECR repo for staging+prod. Pick the alias for the environment we're
            # actually deploying to -- an empty registries.<env> means this build never reached it
            # (e.g. it wasn't built from main, or a specific --environment was picked at build time).
            BASE_TAG=$(jq -r '.base_tag // empty' "$METADATA_FILE")
            if [[ -n "$BASE_TAG" ]]; then
              REPOSITORY=$(jq -r --arg env "${{ steps.env.outputs.environment }}" '.registries[$env] // empty' "$METADATA_FILE")
              if [[ -z "$REPOSITORY" ]]; then
                echo "❌ No ${{ steps.env.outputs.environment }} image available for $COMPONENT -- this build was never pushed to that registry."
                exit 1
              fi
              TAG="${{ steps.env.outputs.environment }}-$BASE_TAG"
            else
              # Backward compatibility: metadata from a build.yml older than the ECR/multi-env tagging change.
              TAG=$(jq -r .tag "$METADATA_FILE")
              REPOSITORY=$(jq -r .repository "$METADATA_FILE")
            fi
            BRANCH=$(jq -r .branch     "$METADATA_FILE")
            COMMIT_SHA=$(jq -r .commit "$METADATA_FILE")

            # Backward compatibility: metadata artifacts produced by a build.yml older
            # than this change won't have a "type" field. Fall back to the legacy
            # component=="web" convention in that case.
            TYPE=$(jq -r '.type // empty' "$METADATA_FILE")
            if [[ -z "$TYPE" || "$TYPE" == "null" ]]; then
              if [[ "$COMPONENT" == "web" ]]; then TYPE="web"; else TYPE="service"; fi
            fi

            case "${{ steps.env.outputs.environment }}" in
              "prod")    ENV_NAME="Production" ;;
              "staging") ENV_NAME="Staging" ;;
              *)         ENV_NAME="Test" ;;
            esac

            # ── Discover instances from GitOps repo ────────────────────────
            # Convention: an instance folder belongs to a component if its name
            # either equals the component exactly  (e.g. issuer)
            # or ends with  -<component>            (e.g. fcmb-issuer, kuda-issuer)
            #
            # This keeps the structure flat at microservices/test/<project>/<folder>
            # so every folder is picked up by the AppSet glob: microservices/test/*/*
            #
            # To add a new instance: create the folder + values.yml in the GitOps repo.
            # To remove an instance: delete the folder from the GitOps repo.
            # ──────────────────────────────────────────────────────────────
            if [[ "$TYPE" == "web" ]]; then
              PROJECT_BASE="${{ env.GITOPS_REPO_PATH }}/web/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}"
            else
              PROJECT_BASE="${{ env.GITOPS_REPO_PATH }}/microservices/${{ steps.env.outputs.environment }}/${{ inputs.project_name }}"
            fi

            # Match folders named exactly <component> or ending with -<component>
            INSTANCE_DIRS=$(find "$PROJECT_BASE" -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
              | grep -E "(^|/)${COMPONENT}$|(^|/)[^/]+-${COMPONENT}$" \
              | sort)

            if [[ -z "$INSTANCE_DIRS" ]]; then
              echo "✅ No existing instances found for $COMPONENT — deploying as base instance"
              deploy_instance "$COMPONENT" "$TAG" "$REPOSITORY" "$BRANCH" "$COMMIT_SHA" "$ENV_NAME" "$COMPONENT" "$TYPE"
            else
              echo "📂 Instances found for $COMPONENT: $(echo "$INSTANCE_DIRS" | xargs -n1 basename | paste -sd', ' -)"
              while IFS= read -r INSTANCE_PATH; do
                INSTANCE_FOLDER=$(basename "$INSTANCE_PATH")
                echo "✅ Deploying $INSTANCE_FOLDER (component=$COMPONENT) tag=$TAG"
                deploy_instance "$COMPONENT" "$TAG" "$REPOSITORY" "$BRANCH" "$COMMIT_SHA" "$ENV_NAME" "$INSTANCE_FOLDER" "$TYPE"
              done <<< "$INSTANCE_DIRS"
            fi
          done

      - name: Extract commit hash
        id: metadata
        run: |
          FIRST_COMPONENT=$(echo "${{ steps.components.outputs.components }}" | cut -d',' -f1 | xargs)
          COMMIT_SHA=$(jq -r .commit "releases/$FIRST_COMPONENT.json")
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${COMMIT_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Push to GitOps repo (test/staging)
        if: steps.params.outputs.environment != 'prod'
        run: |
          cd ${{ env.GITOPS_REPO_PATH }}
          git config user.name github-actions
          git config user.email github-actions@github.com
          git remote set-url origin "https://x-access-token:${{ secrets.gh_gitops_token }}@github.com/${{ env.GITOPS_REPO }}.git"
          git add .

          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "🚀 Deploy ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.env.outputs.environment_upper }}"
            git push origin main
            echo "✅ Changes pushed to GitOps repository"
          fi

      - name: Open PR for production deployment
        if: steps.params.outputs.environment == 'prod'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.gh_gitops_token }}
          base: main
          branch: release-${{ inputs.project_name }}-${{ steps.metadata.outputs.short_sha }}-${{ steps.env.outputs.environment }}
          title: "[${{ steps.env.outputs.environment_upper }}] Release ${{ inputs.project_name }}"
          path: ${{ env.GITOPS_REPO_PATH }}
          body: |
            ## Release Details

            **Project:** ${{ inputs.project_name }}
            **Environment:** ${{ steps.env.outputs.environment_upper }}
            **Commit:** ${{ steps.metadata.outputs.commit_sha }}
            **Components:** ${{ steps.components.outputs.components_array }}

            This PR was automatically generated by the release workflow.
          commit-message: "🚀 Release ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.env.outputs.environment_upper }}"
          delete-branch: true
          labels: release-${{ inputs.project_name }}