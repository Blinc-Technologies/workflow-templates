name: Release

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to (test | staging | prod)'
        required: true
        type: string
        default: 'test'
      components:
        description: 'Comma-separated list of components to release (e.g. api, grpc, subscriber, etc.)'
        required: true
        type: string
      run_id:
        description: 'Run ID of the build workflow'
        required: true
        type: string
      project_name:
        description: 'Name of the project'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace for deployment'
        required: true
        type: string
      secret_store_name:
        description: 'Name of the external secret store'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      # TODO: Configure this to your organization's GitOps repository
      GITOPS_REPO: Blinc-Technologies/blinc-gitops
      GITOPS_REPO_PATH: blinc-gitops
      PROJECT_NAME: ${{ inputs.project_name }}
      NAMESPACE: ${{ inputs.namespace }}
      SECRET_STORE_NAME: ${{ inputs.secret_store_name }}
      ENVIRONMENT: ${{ inputs.environment }}
      COMPONENTS: ${{ inputs.components }}
      RUN_ID: ${{ inputs.run_id }}
      github_token: ${{ secrets.GITHUB_TOKEN }}    
    steps:
    - name: Debug artifact list
      run: |
        gh run view ${{ inputs.run_id }} --repo ${{ github.repository }} --json artifacts --jq '.artifacts[].name'
      env:
        GH_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ secrets.GH_ACTIONS_TOKEN }}
        run-id: ${{ inputs.run_id }}
        name: release-artifacts
        path: releases/
      continue-on-error: true
      id: download-artifacts
    
    - name: Verify release metadata
      run: |
        # Check if artifact download failed
        if [[ "${{ steps.download-artifacts.outcome }}" != "success" ]]; then
          echo "❌ Failed to download artifacts from run ID: ${{ inputs.run_id }}"
          echo "   This could be due to:"
          echo "   1. Invalid run ID"
          echo "   2. Insufficient permissions to access the run"
          echo "   3. The run doesn't exist or artifacts have expired"
          echo "   4. The build workflow didn't generate artifacts (should_deploy=false)"
          exit 1
        fi
        
        # Look for any JSON files under releases/
        if ! ls releases/*.json >/dev/null 2>&1; then
          echo "❌ No release metadata found in the downloaded artifact."
          echo "   This likely means the triggering build workflow ran with 'should_deploy=false'."
          echo "   Please trigger the build again with 'should_deploy=true' or run this release workflow manually pointing to a build run ID that generated artifacts."
          exit 1
        fi
        echo "✅ Release metadata found."

    - name: Set environment & components
      id: set_environment_and_components
      run: |
        ENVIRONMENT="${{ inputs.environment }}"
        if [[ "$ENVIRONMENT" != "test" && "$ENVIRONMENT" != "staging" && "$ENVIRONMENT" != "prod" ]]; then
          echo "❌ Invalid environment: $ENVIRONMENT"
          echo "   Valid environments are: test, staging, prod"
          exit 1
        fi
        COMPONENTS="${{ inputs.components }}"
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        ENVIRONMENT_UPPER=$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]')
        echo "environment_upper=$ENVIRONMENT_UPPER" >> $GITHUB_OUTPUT
        echo "components=$COMPONENTS" >> $GITHUB_OUTPUT
        COMPONENTS_ARRAY="[$(echo "$COMPONENTS" | sed 's/,/, /g')]"
        echo "components_array=$COMPONENTS_ARRAY" >> $GITHUB_OUTPUT

    - name: Enforce prod deploy policy (main only and must be tagged)
      if: ${{ inputs.environment == 'prod' }}
      run: |
        IFS=',' read -ra COMPONENTS <<< "${{ inputs.components }}"
        for COMPONENT in "${COMPONENTS[@]}"; do
          FILE="releases/$COMPONENT.json"
          if [[ ! -f "$FILE" ]]; then
            echo "❌ Missing release metadata for $COMPONENT"
            exit 1
          fi

          BRANCH=$(jq -r .branch "$FILE")
          COMMIT_HASH=$(jq -r .commit "$FILE")

          if [[ "$BRANCH" != "main" ]]; then
            echo "❌ Deployment to prod is only allowed from main. Found: $BRANCH"
            exit 1
          fi

          TAG_EXISTS=$(git ls-remote --tags origin | grep "$COMMIT_HASH" | wc -l)
          if [[ "$TAG_EXISTS" -eq 0 ]]; then
            echo "❌ Commit $COMMIT_HASH is not tagged. Production deployments require a Git tag."
            exit 1
          else
            echo "✅ Commit $COMMIT_HASH is tagged. OK to deploy."
          fi
        done

    - name: Checkout GitOps repo
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.gh_gitops_token || secrets.GH_GITOPS_PAT }}
        path: ${{ env.GITOPS_REPO_PATH }}

    - name: Install yq
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Generate GitOps manifests
      run: |
        IFS=',' read -ra COMPONENTS <<< "${{ inputs.components }}"
        for COMPONENT in "${COMPONENTS[@]}"; do
          # Trim whitespace from component name
          COMPONENT=$(echo "$COMPONENT" | xargs)
          echo "🔍 Reading release tag for $COMPONENT"
          METADATA_FILE="releases/$COMPONENT.json"
          if [[ ! -f "$METADATA_FILE" ]]; then
            echo "❌ Release metadata for $COMPONENT not found"
            echo "   Please ensure the build workflow has run successfully and the release artifacts have been generated for $COMPONENT."
            exit 1
          fi

          TAG=$(jq -r .tag "$METADATA_FILE")
          REPOSITORY=$(jq -r .repository "$METADATA_FILE")  
          BRANCH=$(jq -r .branch "$METADATA_FILE")
          COMMIT_SHA=$(jq -r .commit "$METADATA_FILE")

          echo "✅ Deploying $COMPONENT with tag $TAG"
          
          DEST="${{ env.GITOPS_REPO_PATH }}/microservices/${{ inputs.environment }}/${{ inputs.project_name }}/$COMPONENT"
          mkdir -p "$DEST"

          # Set environment name
          case "${{ inputs.environment }}" in
            "prod")
              ENV_NAME="Production"
              ;;
            "staging")
              ENV_NAME="Staging"
              ;;
            *)
              ENV_NAME="Test"
              ;;
          esac

          # Check if values.yml already exists
          if [[ -f "$DEST/values.yml" ]]; then
            echo "🔄 Updating existing manifest for $COMPONENT in ${{ inputs.environment }} environment"
            
            # Update only the dynamic fields while preserving existing configuration
            yq eval ".image.repository = \"$REPOSITORY\"" -i "$DEST/values.yml"
            yq eval ".image.tag = \"$TAG\"" -i "$DEST/values.yml"
            yq eval ".releaseId = \"$COMMIT_SHA\"" -i "$DEST/values.yml"
            yq eval ".branch = \"$BRANCH\"" -i "$DEST/values.yml"
            yq eval ".commit = \"$COMMIT_SHA\"" -i "$DEST/values.yml"
            yq eval ".externalSecret.forceUpdateAnnotation = \"$COMMIT_SHA\"" -i "$DEST/values.yml"
            
            # Only set these if they don't exist or are empty
            if ! yq eval '.projectName' "$DEST/values.yml" | grep -q .; then
              yq eval ".projectName = \"${{ inputs.project_name }}\"" -i "$DEST/values.yml"
            fi
            if ! yq eval '.componentName' "$DEST/values.yml" | grep -q .; then
              yq eval ".componentName = \"$COMPONENT\"" -i "$DEST/values.yml"
            fi
            if ! yq eval '.namespace' "$DEST/values.yml" | grep -q .; then
              yq eval ".namespace = \"${{ inputs.namespace }}\"" -i "$DEST/values.yml"
            fi
            if ! yq eval '.env.ENVIRONMENT' "$DEST/values.yml" | grep -q .; then
              yq eval ".env.ENVIRONMENT = \"$ENV_NAME\"" -i "$DEST/values.yml"
            fi
            if ! yq eval '.externalSecret.enabled' "$DEST/values.yml" | grep -q .; then
              yq eval ".externalSecret.enabled = true" -i "$DEST/values.yml"
            fi
            if ! yq eval '.externalSecret.storeName' "$DEST/values.yml" | grep -q .; then
              yq eval ".externalSecret.storeName = \"${{ inputs.secret_store_name }}\"" -i "$DEST/values.yml"
            fi
            
            echo "✅ Updated manifest for $COMPONENT"
          else
            echo "📝 Creating new manifest for $COMPONENT in ${{ inputs.environment }} environment"
            
            # Create new manifest with default values
            {
              echo "image:"
              echo "  repository: $REPOSITORY"
              echo "  tag: $TAG"
              echo "projectName: ${{ inputs.project_name }}"
              echo "componentName: $COMPONENT"
              echo "namespace: ${{ inputs.namespace }}" 
              echo "releaseId: $COMMIT_SHA"
              echo "branch: $BRANCH"
              echo "commit: $COMMIT_SHA"
              echo "env:"
              echo "  ENVIRONMENT: $ENV_NAME"
              echo "externalSecret:"
              echo "  enabled: true"
              echo "  forceUpdateAnnotation: $COMMIT_SHA"
              echo "  storeName: ${{ inputs.secret_store_name }}"
              echo "replicaCount: 1" # TODO: make this dynamic
              echo "podLabels: {}"
              echo "addDaprSidecar: false"
              echo "podAnnotations: {}"
              echo "livenessProbe:"
              echo "  enabled: true"
              echo "readinessProbe:"
              echo "  enabled: true"
              echo "volumeMounts: []"
              echo "volumes: []"
              echo "service:"
              echo "  enabled: true" # TODO: make this dynamic
              echo "  type: ClusterIP"
              echo "isGrpc: false" # TODO: make this dynamic
              echo "autoscaling:"
              echo "  enabled: false" # TODO: make this dynamic
              
            } > "$DEST/values.yml"
            
            echo "✅ Created new manifest for $COMPONENT"
          fi
        done

    - name: Extract commit hash
      id: metadata
      run: |
        FIRST_COMPONENT=$(echo "${{ inputs.components }}" | cut -d',' -f1)
        COMMIT_SHA=$(jq -r .commit releases/$FIRST_COMPONENT.json)
        echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

    - name: Push to GitOps repo # (test/staging)
      if: ${{ inputs.environment != 'prod' }}
      run: |
        cd ${{ env.GITOPS_REPO_PATH }}
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add .
        git commit -m "🚀 Deploy ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.set_environment_and_components.outputs.environment_upper }}"
        git push origin main

    - name: Open PR for production deployment
      if: ${{ inputs.environment == 'prod' }}
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.gh_gitops_token || secrets.GH_GITOPS_PAT }}
        base: main
        branch: release-${{ inputs.project_name }}-${{ steps.metadata.outputs.commit_sha }}-${{ inputs.environment }}
        title: "[${{ steps.set_environment_and_components.outputs.environment_upper }}] Release ${{ inputs.project_name }}"
        path: ${{ env.GITOPS_REPO_PATH }}
        body: "Release includes components: ${{ steps.set_environment_and_components.outputs.components_array }}"
        commit-message: "🚀 Release ${{ inputs.project_name }} Commit: ${{ steps.metadata.outputs.commit_sha }}  Environment: ${{ steps.set_environment_and_components.outputs.environment_upper }}"
        delete-branch: true
        labels: release-${{ inputs.project_name }}
