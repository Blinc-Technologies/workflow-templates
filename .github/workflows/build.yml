name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod (optional for auto-triggered runs)'
      project_name:
        description: "Name of the project (used in image repo naming)"
        required: true
        type: string
      components_to_build:
        description: "Comma-separated list of components to build (e.g. api,worker)"
        required: true
        type: string
      create_release:
        description: "Force release even on workflow_dispatch"
        required: false
        default: "false"
        type: string
      build_args:
        description: "Optional build arguments in KEY=VALUE format, separated by newlines"
        required: false
        type: string
      github_username:
        description: "GitHub username for package authentication"
        required: false
        type: string
    secrets:
      registry_username:
        description: "Registry username"
        required: false
      registry_password:
        description: "Registry password or token"
        required: false
      packages_token:
        description: "GitHub token for package authentication"
        required: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      should_release: ${{ steps.release.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release strategy
        id: release
        run: |
          SHOULD_RELEASE=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/heads/(main|feature/) ]]; then
            SHOULD_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            SHOULD_RELEASE=true
          fi
          echo "value=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Build component matrix
        id: matrix
        run: |
          components='[]'
          while IFS= read -r dir; do
            component=$(basename "$dir" | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]')
            if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
              components=$(jq -c --arg c "$component" --arg p "$dir" '. += [{"component":$c,"path":$p}]' <<< "$components")
            fi
          done < <(find src -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          echo "value={\"include\":$components}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"component":[]}'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'test' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Prepare Docker inputs
        id: docker-inputs
        run: |
          BUILD_ARGS="${{ inputs.build_args }}"
          SECRETS=""
          
          if [[ "${{ steps.build-args.outputs.has_github_token }}" == "true" ]]; then
            BUILD_ARGS="${BUILD_ARGS}
          GITHUB_USERNAME=${{ steps.build-args.outputs.github_username }}"
            SECRETS="github_token=${{ secrets.packages_token }}"
          fi
          
          echo "build_args<<EOF" >> $GITHUB_OUTPUT
          echo "$BUILD_ARGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          echo "secrets<<EOF" >> $GITHUB_OUTPUT
          echo "$SECRETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ needs.prepare.outputs.should_release == 'true' }}
          tags: ${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: ${{ steps.docker-inputs.outputs.build_args }}
          secrets: ${{ steps.docker-inputs.outputs.secrets }}
      
      - name: Generate metadata
        if: needs.prepare.outputs.should_release == 'true'
        run: |
          jq -nc \
            --arg component "${{ matrix.component }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg repository "${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{component:$component,branch:$branch,commit:$commit,tag:$commit,repository:$repository,timestamp:$timestamp}' \
            > ${{ matrix.component }}.json

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.should_release == 'true'
        with:
          name: metadata-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          retention-days: 1

  artifacts-upload:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: metadata

      - name: Flatten metadata files
        run: |
          for dir in metadata/metadata-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/*.json metadata/ 2>/dev/null || true
            fi
          done
          # Clean up empty subdirs
          find metadata -type d -empty -delete

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: metadata
          retention-days: 90

      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: metadata-*
          failOnError: false