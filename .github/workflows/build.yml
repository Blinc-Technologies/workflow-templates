name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod (optional for auto-triggered runs)'
      project_name:
        description: "Name of the project (used in image repo naming)"
        required: true
        type: string
      components_to_build:
        description: "Comma-separated list of components to build (e.g. api,worker)"
        required: true
        type: string
      create_release:
        description: "Force release even on workflow_dispatch"
        required: false
        default: "false"
        type: string
      build_args:
        description: "Optional build arguments in KEY=VALUE format, separated by newlines"
        required: false
        type: string
      github_username:
        description: "GitHub username for package authentication"
        required: false
        type: string
      runner_label:
        description: "Runner label to use (default: ubuntu-latest for GitHub-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      registry_username:
        description: "Registry username"
        required: false
      registry_password:
        description: "Registry password or token"
        required: false
      packages_token:
        description: "GitHub token for package authentication"
        required: false

jobs:
  prepare:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      should_release: ${{ steps.release.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine release strategy
        id: release
        run: |
          SHOULD_RELEASE=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/heads/(main|feature/) ]]; then
            SHOULD_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Check release_mode: false, build_only, or build_and_deploy
            if [[ "${{ inputs.create_release }}" == "build_only" || "${{ inputs.create_release }}" == "build_and_deploy" ]]; then
              SHOULD_RELEASE=true
            fi
          fi
          echo "value=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Build component matrix
        id: matrix
        run: |
          components='[]'
          while IFS= read -r dir; do
            component=$(basename "$dir" | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]')
            if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
              components=$(jq -c --arg c "$component" --arg p "$dir" '. += [{"component":$c,"path":$p}]' <<< "$components")
            fi
          done < <(find src -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          echo "value={\"include\":$components}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"component":[]}'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'test' }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Prepare build args
        id: build-args
        run: |
          # Determine GitHub username if token is provided
          if [[ -n "${{ secrets.packages_token }}" ]]; then
            USERNAME="${{ inputs.github_username }}"
            if [[ -z "$USERNAME" ]]; then
              USERNAME="${{ github.actor }}"
            fi
            echo "github_username=$USERNAME" >> $GITHUB_OUTPUT
            echo "has_github_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_github_token=false" >> $GITHUB_OUTPUT
          fi

          # Pass through custom build args
          echo "custom_args<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.build_args }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ needs.prepare.outputs.should_release == 'true' }}
          tags: ${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            ${{ steps.build-args.outputs.custom_args }}
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('GITHUB_USERNAME={0}', steps.build-args.outputs.github_username) || '' }}
          secrets: |
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('github_token={0}', secrets.packages_token) || '' }}

      - name: Generate metadata
        if: needs.prepare.outputs.should_release == 'true'
        run: |
          # Determine if deployment should proceed
          SHOULD_DEPLOY=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Auto-deploy for main branch
            SHOULD_DEPLOY=true
          elif [[ "${{ inputs.create_release }}" == "build_and_deploy" ]]; then
            # Deploy when explicitly requested
            SHOULD_DEPLOY=true
          fi
          
          jq -nc \
            --arg component "${{ matrix.component }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg repository "${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson should_deploy "$SHOULD_DEPLOY" \
            '{component:$component,branch:$branch,commit:$commit,tag:$commit,repository:$repository,timestamp:$timestamp,should_deploy:$should_deploy}' \
            > ${{ matrix.component }}.json

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.should_release == 'true'
        with:
          name: metadata-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          retention-days: 1

  artifacts-upload:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: metadata

      - name: Flatten metadata files
        run: |
          for dir in metadata/metadata-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/*.json metadata/ 2>/dev/null || true
            fi
          done
          # Clean up empty subdirs
          find metadata -type d -empty -delete

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: metadata
          retention-days: 90

      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: metadata-*
          failOnError: false