name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod (optional for auto-triggered runs)'
      project_name:
        description: "Name of the project (used in image repo naming)"
        required: true
        type: string
      components_to_build:
        description: "Comma-separated list of components to build (e.g. api,worker)"
        required: true
        type: string
      create_release:
        description: "Force release even on workflow_dispatch"
        required: false
        default: "false"
        type: string
      build_args:
        description: "Optional build arguments in KEY=VALUE format, separated by newlines"
        required: false
        type: string
      github_username:
        description: "GitHub username for package authentication"
        required: false
        type: string
      runner_label:
        description: "Runner label to use (default: ubuntu-latest for GitHub-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      registry_username:
        description: "Registry username"
        required: false
      registry_password:
        description: "Registry password or token"
        required: false
      packages_token:
        description: "GitHub token for package authentication"
        required: false
      aws_role_arn:
        description: "IAM role to assume (via OIDC) for pushing to ECR. Required when environment is staging or prod."
        required: false

jobs:
  prepare:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      should_release: ${{ steps.release.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine release strategy
        id: release
        run: |
          SHOULD_RELEASE=false
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/heads/(main|master) ]]; then
            SHOULD_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            SHOULD_RELEASE=true
          fi
          echo "value=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Build component matrix
        id: matrix
        run: |
          components='[]'

          # Scan src/ subdirectories for backend components (e.g. src/Blinc.Api/Dockerfile)
          if [ -d "src" ]; then
            while IFS= read -r dir; do
              component=$(basename "$dir" | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]')
              if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
                components=$(jq -c --arg c "$component" --arg p "$dir" '. += [{"component":$c,"path":$p,"type":"service"}]' <<< "$components")
              fi
            done < <(find src -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          fi

          # Scan apps/ subdirectories for standalone frontend components in a monorepo
          # (e.g. apps/partner-dashboard/Dockerfile). Component name = folder name, verbatim.
          if [ -d "apps" ]; then
            while IFS= read -r dir; do
              component=$(basename "$dir")
              if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
                components=$(jq -c --arg c "$component" --arg p "$dir" '. += [{"component":$c,"path":$p,"type":"web"}]' <<< "$components")
                echo "📦 Added apps/$component web component"
              fi
            done < <(find apps -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          fi

          # Check for root-level Dockerfile (frontend/web component)
          if [[ -f "Dockerfile" && "${{ inputs.components_to_build }}" == *"web"* ]]; then
            components=$(jq -c '. += [{"component":"web","path":".","type":"web"}]' <<< "$components")
            echo "📦 Added root-level web component"
          fi

          echo "value={\"include\":$components}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"component":[]}'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'test' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Resolve frontend env vars key
        id: env-key
        if: matrix.type == 'web'
        run: |
          KEY=$(echo "${{ matrix.component }}" | tr '[:lower:]-' '[:upper:]_')
          echo "name=ENV_VARS_${KEY}" >> "$GITHUB_OUTPUT"

      - name: Create frontend .env file
        if: matrix.type == 'web' && (vars[steps.env-key.outputs.name] != '' || vars.ENV_VARS != '')
        run: |
          echo "${{ vars[steps.env-key.outputs.name] || vars.ENV_VARS }}" > "${{ matrix.path }}/.env"
          echo "✅ .env file created for frontend build (${{ matrix.component }})"

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Prepare build args
        id: build-args
        run: |
          # Determine GitHub username if token is provided
          if [[ -n "${{ secrets.packages_token }}" ]]; then
            USERNAME="${{ inputs.github_username }}"
            if [[ -z "$USERNAME" ]]; then
              USERNAME="${{ github.actor }}"
            fi
            echo "github_username=$USERNAME" >> $GITHUB_OUTPUT
            echo "has_github_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_github_token=false" >> $GITHUB_OUTPUT
          fi

          # Pass through custom build args
          echo "custom_args<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.build_args }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compute image tag
        id: image-tag
        run: echo "value=${{ github.sha }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      # ECR is needed unless this build explicitly targets 'test' only. That covers both
      # the auto case (no environment input -> tag everything) and an explicit staging/prod pick.
      - name: Configure AWS credentials
        if: needs.prepare.outputs.should_release == 'true' && (github.ref_name == 'main' || github.ref_name == 'master') && inputs.environment != 'test'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.prepare.outputs.should_release == 'true' && (github.ref_name == 'main' || github.ref_name == 'master') && inputs.environment != 'test'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: needs.prepare.outputs.should_release == 'true' && (github.ref_name == 'main' || github.ref_name == 'master') && inputs.environment != 'test'
        run: |
          REPO_NAME="${{ inputs.project_name }}_${{ matrix.component }}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true

      - name: Resolve image tags to push
        id: tags
        run: |
          # Two modes:
          #   - inputs.environment unset (e.g. plain push to main): build once, tag for
          #     every environment this build qualifies for (test always; staging/prod only
          #     from main).
          #   - inputs.environment set explicitly: tag ONLY that one environment. staging/prod
          #     still require main -- ECR never gets a push from a non-main build, dispatched
          #     or not.
          BASE="${{ steps.image-tag.outputs.value }}"
          TEST_REPO=""
          STAGING_REPO=""
          PROD_REPO=""
          TAGS=""

          if [[ "${{ needs.prepare.outputs.should_release }}" != "true" ]]; then
            TEST_REPO="${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}"
            TAGS="$TEST_REPO:test-$BASE"
          else
            IS_MAIN=false
            if [[ "${{ github.ref_name }}" == "main" || "${{ github.ref_name }}" == "master" ]]; then
              IS_MAIN=true
            fi
            TARGET_ENV="${{ inputs.environment }}"

            case "$TARGET_ENV" in
              "")
                TEST_REPO="${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}"
                TAGS="$TEST_REPO:test-$BASE"
                if [[ "$IS_MAIN" == "true" ]]; then
                  STAGING_REPO="${{ steps.ecr-login.outputs.registry }}/${{ inputs.project_name }}_${{ matrix.component }}"
                  PROD_REPO="$STAGING_REPO"
                  TAGS="$TAGS
          $STAGING_REPO:staging-$BASE
          $PROD_REPO:prod-$BASE"
                fi
                ;;
              test)
                TEST_REPO="${{ vars.REGISTRY_HOST }}/${{ inputs.project_name }}_${{ matrix.component }}"
                TAGS="$TEST_REPO:test-$BASE"
                ;;
              staging|prod)
                if [[ "$IS_MAIN" != "true" ]]; then
                  echo "❌ environment=$TARGET_ENV requires building from main -- ECR never accepts a push from another branch. Current branch: ${{ github.ref_name }}"
                  exit 1
                fi
                REPO="${{ steps.ecr-login.outputs.registry }}/${{ inputs.project_name }}_${{ matrix.component }}"
                if [[ "$TARGET_ENV" == "staging" ]]; then STAGING_REPO="$REPO"; else PROD_REPO="$REPO"; fi
                TAGS="$REPO:$TARGET_ENV-$BASE"
                ;;
              *)
                echo "❌ Unknown environment: $TARGET_ENV"
                exit 1
                ;;
            esac
          fi

          echo "test_repo=$TEST_REPO" >> $GITHUB_OUTPUT
          echo "staging_repo=$STAGING_REPO" >> $GITHUB_OUTPUT
          echo "prod_repo=$PROD_REPO" >> $GITHUB_OUTPUT
          echo "value<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ needs.prepare.outputs.should_release == 'true' }}
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            ${{ steps.build-args.outputs.custom_args }}
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('GITHUB_USERNAME={0}', steps.build-args.outputs.github_username) || '' }}
          secrets: |
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('github_token={0}', secrets.packages_token) || '' }}

      - name: Generate metadata
        if: needs.prepare.outputs.should_release == 'true'
        run: |
          # staging and prod share one AWS account/ECR repo, distinguished only by tag prefix.
          # An empty registries.<env> means this specific build was never pushed there.
          jq -nc \
            --arg component "${{ matrix.component }}" \
            --arg type "${{ matrix.type }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg base_tag "${{ steps.image-tag.outputs.value }}" \
            --arg test_repo "${{ steps.tags.outputs.test_repo }}" \
            --arg staging_repo "${{ steps.tags.outputs.staging_repo }}" \
            --arg prod_repo "${{ steps.tags.outputs.prod_repo }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{component:$component,type:$type,branch:$branch,commit:$commit,base_tag:$base_tag,
              registries:{test:$test_repo, staging:$staging_repo, prod:$prod_repo},
              timestamp:$timestamp}' \
            > ${{ matrix.component }}.json

      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.should_release == 'true'
        with:
          name: metadata-${{ matrix.component }}
          path: ${{ matrix.component }}.json
          retention-days: 1

  artifacts-upload:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: metadata

      - name: Flatten metadata files
        run: |
          for dir in metadata/metadata-*; do
            if [ -d "$dir" ]; then
              mv "$dir"/*.json metadata/ 2>/dev/null || true
            fi
          done
          # Clean up empty subdirs
          find metadata -type d -empty -delete

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: metadata
          retention-days: 90

      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: metadata-*
          failOnError: false