name: Build

# Environments are tiers: test < staging < prod. Building for a tier also produces every tier
# below it, so a prod build gives you test + staging + prod images in one go. The release workflow
# auto-deploys only the targeted tier (prod = GitOps PR); the lower tiers' images are ready to be
# released later without rebuilding. Backend services are built ONCE and that
# single image is pushed under every tier's tag. Frontends bake their env vars into the image at
# build time, so they get one build per tier, each with that tier's ENV_VARS.

on:
  workflow_call:
    inputs:
      environment:
        required: false
        type: string
        description: 'test | staging | prod -- the highest tier to build for (lower tiers are included). Empty = default_environment on main, test elsewhere.'
      default_environment:
        required: false
        type: string
        default: 'test'
        description: 'Tier used for pushes to main when no environment is given (test | staging | prod)'
      project_name:
        description: "Name of the project (used in image repo naming)"
        required: true
        type: string
      components_to_build:
        description: "Comma-separated list of components to build (e.g. api,worker)"
        required: true
        type: string
      create_release:
        description: "Force release on workflow_dispatch. Implied when environment is staging or prod."
        required: false
        default: "false"
        type: string
      build_args:
        description: "Optional build arguments in KEY=VALUE format, separated by newlines"
        required: false
        type: string
      github_username:
        description: "GitHub username for package authentication"
        required: false
        type: string
      runner_label:
        description: "Runner label to use (default: ubuntu-latest for GitHub-hosted)"
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      packages_token:
        description: "GitHub token for package authentication"
        required: false
      aws_role_arn:
        description: "IAM role to assume (via OIDC) for pushing to ECR. Required when building for staging or prod."
        required: false

jobs:
  prepare:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      should_release: ${{ steps.plan.outputs.should_release }}
      target: ${{ steps.plan.outputs.target }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve target tier and release strategy
        id: plan
        run: |
          IS_MAIN=false
          if [[ "${{ github.ref }}" =~ ^refs/heads/(main|master)$ ]]; then
            IS_MAIN=true
          fi

          TARGET="${{ inputs.environment }}"
          if [[ -z "$TARGET" ]]; then
            if [[ "$IS_MAIN" == "true" ]]; then TARGET="${{ inputs.default_environment || 'test' }}"; else TARGET="test"; fi
          fi

          case "$TARGET" in
            test|staging|prod) ;;
            *) echo "❌ Unknown environment: $TARGET (expected test, staging or prod)"; exit 1 ;;
          esac

          SHOULD_RELEASE=false
          if [[ "${{ github.event_name }}" == "push" && "$IS_MAIN" == "true" ]]; then
            SHOULD_RELEASE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Picking an environment by hand on main (or staging/prod anywhere, which then fails the
            # main-only check below) means "ship it" -- no separate create_release toggle needed.
            if [[ "${{ inputs.create_release }}" == "true" || "$TARGET" != "test" || \
                  ( "$IS_MAIN" == "true" && -n "${{ inputs.environment }}" ) ]]; then
              SHOULD_RELEASE=true
            fi
          fi

          if [[ "$SHOULD_RELEASE" != "true" ]]; then
            # Nothing gets pushed, so this is just a verification build.
            TARGET="test"
          elif [[ "$TARGET" != "test" && "$IS_MAIN" != "true" ]]; then
            echo "❌ environment=$TARGET requires building from main -- ECR never accepts a push from another branch. Current branch: ${{ github.ref_name }}"
            exit 1
          fi

          case "$TARGET" in
            test)    TIERS="test" ;;
            staging) TIERS="test,staging" ;;
            prod)    TIERS="test,staging,prod" ;;
          esac

          echo "🎯 Target: $TARGET -> tiers: $TIERS (release: $SHOULD_RELEASE)"
          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "tiers=$TIERS" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT

      - name: Build component matrix
        id: matrix
        env:
          TIERS: ${{ steps.plan.outputs.tiers }}
        run: |
          components='[]'
          IFS=',' read -ra TIER_LIST <<< "$TIERS"

          # Services: one build, tagged for every tier. Runs under the 'test' GitHub environment,
          # which holds REGISTRY_HOST / AWS_REGION (same as the old all-tier main build).
          # Web: one build per tier, each under that tier's GitHub environment for its ENV_VARS.
          add_component() {
            local c="$1" p="$2" type="$3"
            if [[ "$type" == "web" ]]; then
              for tier in "${TIER_LIST[@]}"; do
                components=$(jq -c --arg c "$c" --arg p "$p" --arg t "$tier" \
                  '. += [{component:$c, path:$p, type:"web", key:"\($c)--\($t)", gh_env:$t, tiers:$t}]' <<< "$components")
              done
            else
              components=$(jq -c --arg c "$c" --arg p "$p" --arg t "$TIERS" \
                '. += [{component:$c, path:$p, type:"service", key:$c, gh_env:"test", tiers:$t}]' <<< "$components")
            fi
          }

          # Scan src/ subdirectories for backend components (e.g. src/Blinc.Api/Dockerfile)
          if [ -d "src" ]; then
            while IFS= read -r dir; do
              component=$(basename "$dir" | sed 's/.*\.//' | tr '[:upper:]' '[:lower:]')
              if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
                add_component "$component" "$dir" service
              fi
            done < <(find src -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          fi

          # Scan apps/ subdirectories for standalone frontend components in a monorepo
          # (e.g. apps/partner-dashboard/Dockerfile). Component name = folder name, verbatim.
          if [ -d "apps" ]; then
            while IFS= read -r dir; do
              component=$(basename "$dir")
              if [[ "${{ inputs.components_to_build }}" == *"$component"* ]]; then
                add_component "$component" "$dir" web
                echo "📦 Added apps/$component web component"
              fi
            done < <(find apps -maxdepth 1 -mindepth 1 -type d -exec test -f {}/Dockerfile \; -print)
          fi

          # Check for root-level Dockerfile (frontend/web component)
          if [[ -f "Dockerfile" && "${{ inputs.components_to_build }}" == *"web"* ]]; then
            add_component web . web
            echo "📦 Added root-level web component"
          fi

          echo "value={\"include\":$components}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    environment: ${{ matrix.gh_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - name: Resolve frontend env vars key
        id: env-key
        if: matrix.type == 'web'
        run: |
          KEY=$(echo "${{ matrix.component }}" | tr '[:lower:]-' '[:upper:]_')
          echo "name=ENV_VARS_${KEY}" >> "$GITHUB_OUTPUT"

      - name: Create frontend .env file
        if: matrix.type == 'web' && (vars[steps.env-key.outputs.name] != '' || vars.ENV_VARS != '')
        run: |
          echo "${{ vars[steps.env-key.outputs.name] || vars.ENV_VARS }}" > "${{ matrix.path }}/.env"
          echo "✅ .env file created for frontend build (${{ matrix.component }}, ${{ matrix.gh_env }})"

      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Prepare build args
        id: build-args
        run: |
          # Determine GitHub username if token is provided
          if [[ -n "${{ secrets.packages_token }}" ]]; then
            USERNAME="${{ inputs.github_username }}"
            if [[ -z "$USERNAME" ]]; then
              USERNAME="${{ github.actor }}"
            fi
            echo "github_username=$USERNAME" >> $GITHUB_OUTPUT
            echo "has_github_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_github_token=false" >> $GITHUB_OUTPUT
          fi

          # Pass through custom build args
          echo "custom_args<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.build_args }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compute image tag
        id: image-tag
        run: echo "value=${{ github.sha }}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      # ECR (staging + prod share one repo, distinguished by tag prefix). prepare already
      # guarantees staging/prod tiers only appear on main.
      - name: Configure AWS credentials
        if: needs.prepare.outputs.should_release == 'true' && (contains(matrix.tiers, 'staging') || contains(matrix.tiers, 'prod'))
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.prepare.outputs.should_release == 'true' && (contains(matrix.tiers, 'staging') || contains(matrix.tiers, 'prod'))
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        if: needs.prepare.outputs.should_release == 'true' && (contains(matrix.tiers, 'staging') || contains(matrix.tiers, 'prod'))
        run: |
          REPO_NAME="${{ inputs.project_name }}_${{ matrix.component }}"
          aws ecr describe-repositories --repository-names "$REPO_NAME" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "$REPO_NAME" --image-scanning-configuration scanOnPush=true

      - name: Resolve image tags to push
        id: tags
        run: |
          BASE="${{ steps.image-tag.outputs.value }}"
          REPO_NAME="${{ inputs.project_name }}_${{ matrix.component }}"
          ECR_REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          TEST_REPO=""
          STAGING_REPO=""
          PROD_REPO=""
          TAGS=""
          HAS_TEST=false
          HAS_ECR=false

          IFS=',' read -ra TIER_LIST <<< "${{ matrix.tiers }}"
          for tier in "${TIER_LIST[@]}"; do
            case "$tier" in
              test)
                if [[ "${{ needs.prepare.outputs.should_release }}" == "true" && -z "${{ vars.REGISTRY_HOST }}" ]]; then
                  echo "❌ REGISTRY_HOST is not set for the '${{ matrix.gh_env }}' environment -- cannot push the test image."
                  exit 1
                fi
                TEST_REPO="${{ vars.REGISTRY_HOST }}/$REPO_NAME"
                TAGS+="$TEST_REPO:test-$BASE"$'\n'
                HAS_TEST=true
                ;;
              staging)
                STAGING_REPO="$ECR_REGISTRY/$REPO_NAME"
                TAGS+="$STAGING_REPO:staging-$BASE"$'\n'
                HAS_ECR=true
                ;;
              prod)
                PROD_REPO="$ECR_REGISTRY/$REPO_NAME"
                TAGS+="$PROD_REPO:prod-$BASE"$'\n'
                HAS_ECR=true
                ;;
            esac
          done

          # test cluster is amd64, staging/prod (ECR) are arm64. One image going to both is multi-arch.
          if [[ "$HAS_ECR" == "true" && "$HAS_TEST" == "true" ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          elif [[ "$HAS_ECR" == "true" ]]; then
            PLATFORMS="linux/arm64"
          else
            PLATFORMS="linux/amd64"
          fi

          echo "🏷️  Tags:"; echo "$TAGS"
          echo "test_repo=$TEST_REPO" >> $GITHUB_OUTPUT
          echo "staging_repo=$STAGING_REPO" >> $GITHUB_OUTPUT
          echo "prod_repo=$PROD_REPO" >> $GITHUB_OUTPUT
          echo "platforms=$PLATFORMS" >> $GITHUB_OUTPUT
          echo "value<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: contains(steps.tags.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          # v6+ uploads a .dockerbuild artifact per build (90 day retention), which exhausted the artifact quota
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: ${{ matrix.path }}/Dockerfile
          push: ${{ needs.prepare.outputs.should_release == 'true' }}
          tags: ${{ steps.tags.outputs.value }}
          platforms: ${{ steps.tags.outputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          build-args: |
            ${{ steps.build-args.outputs.custom_args }}
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('GITHUB_USERNAME={0}', steps.build-args.outputs.github_username) || '' }}
          secrets: |
            ${{ steps.build-args.outputs.has_github_token == 'true' && format('github_token={0}', secrets.packages_token) || '' }}

      - name: Generate metadata
        if: needs.prepare.outputs.should_release == 'true'
        run: |
          # environment  = the tier this build targeted -- the only one the release auto-deploys
          # environments = the tiers this matrix entry pushed images for (merged per component in
          #                artifacts-upload); any of them can be released manually without a rebuild.
          # An empty registries.<env> means this build was never pushed there.
          jq -nc \
            --arg component "${{ matrix.component }}" \
            --arg type "${{ matrix.type }}" \
            --arg environment "${{ needs.prepare.outputs.target }}" \
            --arg tiers "${{ matrix.tiers }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg base_tag "${{ steps.image-tag.outputs.value }}" \
            --arg test_repo "${{ steps.tags.outputs.test_repo }}" \
            --arg staging_repo "${{ steps.tags.outputs.staging_repo }}" \
            --arg prod_repo "${{ steps.tags.outputs.prod_repo }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{component:$component,type:$type,environment:$environment,environments:($tiers|split(",")),
              branch:$branch,commit:$commit,base_tag:$base_tag,
              registries:{test:$test_repo, staging:$staging_repo, prod:$prod_repo},
              timestamp:$timestamp}' \
            > "${{ matrix.key }}.json"

      - uses: actions/upload-artifact@v7
        if: needs.prepare.outputs.should_release == 'true'
        with:
          name: metadata-${{ matrix.key }}
          path: ${{ matrix.key }}.json
          retention-days: 1

  artifacts-upload:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: metadata-*
          merge-multiple: true
          path: parts

      # Web components produce one file per tier; fold them into a single <component>.json so the
      # release workflow sees one record per component with every tier's registry filled in.
      - name: Merge metadata per component
        run: |
          mkdir -p metadata
          for COMPONENT in $(jq -r '.component' parts/*.json | sort -u); do
            jq -s --arg c "$COMPONENT" '
              map(select(.component == $c)) as $parts
              | $parts[0]
              | .environments = ([$parts[].environments[]] | unique)
              | .registries = (reduce $parts[].registries as $r
                  ({test:"", staging:"", prod:""}; . + ($r | with_entries(select(.value != "")))))
            ' parts/*.json > "metadata/$COMPONENT.json"
            echo "📦 $COMPONENT: $(jq -c '.environments' "metadata/$COMPONENT.json")"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: metadata
          retention-days: 30

      - name: Delete temporary artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: metadata-*
          failOnError: false
